<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Control - Base de Datos</title>
    <link rel="icon" type="image/png" href="img/asogin.jpeg">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="navbar">
        <div class="logo" style="display: flex; align-items: center; gap: 10px;">
            <img src="img/asogin.jpeg" alt="Logo Asogin" style="height: 32px; width: 32px; border-radius: 50%; object-fit: cover;">
            <span>Gym Control</span>
        </div>
        <nav class="nav-links" style="display: flex; align-items: center; gap: 15px;">
            <a href="index.html">Principal</a>
            <a href="database.html" class="active">Base de Datos</a>
            <a href="dashboard.html">Dashboard</a>
            <!-- Botón de Cerrar Sesión Integrado -->
            <button onclick="cerrarSesion()" style="background: #ff6600; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: background 0.2s; display: inline-flex; align-items: center; gap: 4px;" onmouseover="this.style.background='#e55b00'" onmouseout="this.style.background='#ff6600'" title="Cerrar Sesión">
                🚪 Salir
            </button>
        </nav>
    </header>

    <main class="container">
        <h1>Base de Datos General de Clientes</h1>

        <section class="card">
            <h2>📁 Directorio de Clientes</h2>
            
            <!-- BUSCADOR Y FILTROS AVANZADOS -->
            <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
                <input type="text" id="buscador" placeholder="🔍 Buscar por cédula, nombre o apellido..." onkeyup="filtrarClientesDB()" style="flex: 1; min-width: 200px; padding: 10px 14px; background: #1a1a1a; border: 1px solid #303030; color: white; border-radius: 8px; outline: none;">
                
                <select id="filtro-sede-db" onchange="filtrarClientesDB()" style="padding: 10px 14px; background: #1a1a1a; border: 1px solid #303030; color: white; border-radius: 8px; outline: none;">
                    <option value="">Todas las sedes</option>
                    <option value="La Trinidad">La Trinidad</option>
                    <option value="Polideportivo">Polideportivo</option>
                </select>

                <select id="filtro-plan-db" onchange="filtrarClientesDB()" style="padding: 10px 14px; background: #1a1a1a; border: 1px solid #303030; color: white; border-radius: 8px; outline: none;">
                    <option value="">Todos los planes</option>
                    <option value="Solo máquinas">Solo máquinas</option>
                    <option value="Guiado">Guiado</option>
                    <option value="Asistido">Asistido</option>
                    <option value="Personalizado">Personalizado</option>
                    <option value="Edad plateada grupal">Edad plateada grupal</option>
                    <option value="Edad plateada individual">Edad plateada individual</option>
                    <option value="Funcional híbrido">Funcional híbrido</option>
                    <option value="Funcional híbrido B">Funcional híbrido B</option>
                    <option value="Mayckol N">Mayckol N</option>
                    <option value="Mayckol A">Mayckol A</option>
                </select>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Cédula</th>
                            <th>Nombre y Apellido</th>
                            <th>Celular</th>
                            <th>Plan / Modalidad</th>
                            <th>Estado / Inactividad</th>
                            <th>Cobrado por</th>
                            <th>Acciones</th>
                            <th>Sede</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-database">
                        <tr><td colspan="9" style="text-align: center;">Cargando base de datos...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="modal-editar" class="card" style="display: none; border: 2px solid var(--primary);">
        <h2>✏️ Editar Datos, Vencimiento o Foto</h2>
        <form id="form-editar">
            <input type="hidden" id="edit-id">
            <div class="form-grid">
                <div class="form-group">
                    <label for="edit-cedula">Cédula:</label>
                    <input type="text" id="edit-cedula" required>
                </div>
                <div class="form-group">
                    <label for="edit-nombre">Nombre:</label>
                    <input type="text" id="edit-nombre" required>
                </div>
                <div class="form-group">
                    <label for="edit-apellido">Apellido:</label>
                    <input type="text" id="edit-apellido" required>
                </div>
                <div class="form-group">
                    <label for="edit-sede">Sede:</label>
                    <select id="edit-sede" required>
                        <option value="La Trinidad">La Trinidad</option>
                        <option value="Polideportivo">Polideportivo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="edit-celular">Celular:</label>
                    <input type="text" id="edit-celular">
                </div>
                <div class="form-group">
                    <label for="edit-correo">Correo:</label>
                    <input type="email" id="edit-correo">
                </div>
                <div class="form-group">
                    <label for="edit-vencimiento">Fecha de Vencimiento:</label>
                    <input type="date" id="edit-vencimiento" required>
                </div>
                <div class="form-group">
                    <label for="edit-foto">Actualizar Fotografía (Opcional):</label>
                    <input type="file" id="edit-foto" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="edit-cobrado">Cobrado por:</label>
                    <input type="text" id="edit-cobrado">
                </div>
            </div>
            <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                <button type="submit" class="btn-primary">Guardar Cambios</button>
                <button type="button" class="btn-renovar" style="background-color: var(--danger);" onclick="eliminarClienteActual()">🗑️ Eliminar Cliente</button>
                <button type="button" class="btn-renovar" style="background-color: #6c757d;" onclick="cerrarModalEditar()">Cancelar</button>
            </div>
        </form>
    </div>

    <script src="database.js"></script>
</body>
</html>
